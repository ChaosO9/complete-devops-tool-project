- name: Configure Jenkins Master Server
  hosts: jenkins_master
  become: yes
  gather_facts: false
  tasks:
      - name: Install OpenJDK 17 on Ubuntu
        apt:
            name: openjdk-17-jdk
            state: present
            update_cache: yes
      - name: Ensure keyring directory exist
        file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"
      - name: Download Jenkins GPG key
        get_url:
            url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
            dest: /etc/apt/keyrings/jenkins.keyring.asc
            mode: "0644"
            force: yes
      - name: Add Jenkins official repository
        apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/jenkins.keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
            state: present
            filename: jenkins
            update_cache: yes
      - name: Install Jenkins
        apt:
            name: jenkins
            state: present
            update_cache: yes
      - name: Start Jenkins service
        service:
            name: jenkins
            state: started
            enabled: yes
